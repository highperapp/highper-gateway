## Implementation Details

### Haversine Formula
Calculates great-circle distance between two points on Earth's surface:
```
a = sin²(Δlat/2) + cos(lat1) × cos(lat2) × sin²(Δlon/2)
c = 2 × atan2(√a, √(1−a))
distance = R × c  (where R = 6371 km)
```

### GeoIP Providers

**MaxMind GeoIP2/GeoLite2**:
- Binary format (.mmdb)
- High accuracy
- Regular updates
- Free tier available

**IP2Location**:
- Binary format (.BIN)
- Commercial and free tiers
- Requires DB5+ for coordinates
- Good Asia-Pacific coverage

## Troubleshooting

### Issue: "Geographic load balancing disabled"
- **Cause**: GeoIP database not found or failed to load
- **Solution**: Check database path and file permissions

### Issue: "No lat/lon data for IP"
- **Cause**: Database doesn't include coordinate data
- **Solution**: Use MaxMind GeoLite2-City or IP2Location DB5+

### Issue: Requests not routing to nearest server
- **Cause**: Client IP not detected
- **Solution**: Ensure X-Forwarded-For header is set

### Issue: All requests go to same server
- **Cause**: GeoIP database not loaded
- **Solution**: Check logs for initialization errors, verify database path

## Notes
- Geographic routing requires GeoIP database (not included)
- MaxMind GeoLite2 is free but requires registration
- IP2Location has free LITE databases
- Database should be updated monthly for accuracy
- Private/internal IPs will fall back to configured algorithm
- Distance calculation is accurate to within ~0.5%

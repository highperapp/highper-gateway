### 4. Multiple Requests Show Geographic Distribution
```bash
# US requests
for i in {1..10}; do
  curl -s http://geo.loadtest.local:8080/api/test \
    -H "X-Forwarded-For: 4.2.2.2" | head -1
done

# Europe requests
for i in {1..10}; do
  curl -s http://geo.loadtest.local:8080/api/test \
    -H "X-Forwarded-For: 151.101.1.1" | head -1
done

# Asia requests
for i in {1..10}; do
  curl -s http://geo.loadtest.local:8080/api/test \
    -H "X-Forwarded-For: 202.12.27.33" | head -1
done

# Expected: Each region's requests go to their nearest server
```

### 5. Fallback When GeoIP Unavailable
```bash
# Request without X-Forwarded-For header
curl -i http://geo.loadtest.local:8080/api/test

# Expected: Falls back to least_conn algorithm
# Check logs for: "No client IP provided, using fallback algorithm"
```

### 6. Invalid IP Handling
```bash
# Request with invalid IP
curl -i http://geo.loadtest.local:8080/api/test \
  -H "X-Forwarded-For: invalid-ip"

# Expected: Falls back to least_conn algorithm
# Check logs for: "Failed to parse client IP"
```

### 7. GeoIP Lookup Verification
```bash
# Check what location is detected for a specific IP
# Look in gateway logs for lines like:
# "Client IP 4.2.2.2 located at (38.0, -97.0)"
# "Distance to server 0 (region: Some(\"us-east-1\")): 1234.56 km"
```

### 8. Performance Test
```bash
# Test with ApacheBench from different "locations"
ab -n 10000 -c 100 -H "X-Forwarded-For: 4.2.2.2" \
  http://geo.loadtest.local:8080/api/test

ab -n 10000 -c 100 -H "X-Forwarded-For: 151.101.1.1" \
  http://geo.loadtest.local:8080/api/test

ab -n 10000 -c 100 -H "X-Forwarded-For: 202.12.27.33" \
  http://geo.loadtest.local:8080/api/test

# Expected: Requests routed to nearest server for each region
```

## Expected Behavior

1. **Client IP Detection**: Extracts IP from X-Forwarded-For or X-Real-IP headers
2. **GeoIP Lookup**: Determines client's latitude/longitude using MaxMind or IP2Location
3. **Distance Calculation**: Uses Haversine formula to calculate distance to each backend
4. **Nearest Selection**: Routes request to backend with minimum distance
5. **Fallback**: Uses least_conn algorithm if:
   - No GeoIP database configured
   - Client IP cannot be determined
   - GeoIP lookup fails
   - No location data in database
6. **Health Checks**: Only routes to healthy backends
7. **Logging**: Detailed logs show distance calculations and server selection


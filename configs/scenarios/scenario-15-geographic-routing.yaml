# Scenario 15: Geographic Load Balancing
# Routes requests to nearest backend based on client IP geolocation
# Status: ✅ FULLY IMPLEMENTED (Phase 2.4 complete)

server:
  bind:
    - "0.0.0.0:8080"  # HTTP
  tls_bind:
    - "0.0.0.0:8443"  # HTTPS

  workers: "auto"

  protocols:
    - http1
    - http2

  # Performance settings
  performance:
    connection_pool:
      enabled: true
      min_idle: 100
      max_idle: 10000
      max_lifetime: 300
    backpressure:
      enabled: true
      max_connections: 100000
      memory_limit_mb: 2048

# TLS configuration
tls:
  certificates:
    - domain: "geo.loadtest.local"
      cert_file: "/mnt/e/my-opensource/highper-gateway/certs/api.crt"
      key_file: "/mnt/e/my-opensource/highper-gateway/certs/api.key"

# Upstream backends with geographic locations
upstreams:
  - name: "global_api"
    servers:
      # US East (Virginia)
      - url: "http://127.0.0.1:8081"
        weight: 1
        location:
          lat: 37.5483    # Ashburn, VA
          lon: -77.4728
          region: "us-east-1"

      # Europe (Ireland)
      - url: "http://127.0.0.1:8082"
        weight: 1
        location:
          lat: 53.3498    # Dublin
          lon: -6.2603
          region: "eu-west-1"

      # Asia Pacific (Tokyo)
      - url: "http://127.0.0.1:8083"
        weight: 1
        location:
          lat: 35.6762    # Tokyo
          lon: 139.6503
          region: "ap-northeast-1"

    load_balancing:
      algorithm: "geographic"
      geoip_provider: "maxmind"    # or "ip2location"
      geoip_db_path: "/var/lib/GeoIP/GeoLite2-City.mmdb"  # Path to GeoIP database
      fallback_algorithm: "least_conn"  # Fallback if GeoIP unavailable
      health_checks:
        enabled: true
        interval: 5
        timeout: 2
        healthy_threshold: 2
        unhealthy_threshold: 3

# Routes
routes:
  - name: "geo_api"
    match:
      hosts:
        - "geo.loadtest.local"
      paths:
        - "/api/*"
    upstream: "global_api"

  - name: "all_requests"
    match:
      hosts:
        - "*"
      paths:
        - "/*"
    upstream: "global_api"

# Observability
observability:
  metrics:
    enabled: true
    port: 9090
  tracing:
    enabled: true
    exporter: "stdout"
    sample_rate: 1.0
  logging:
    level: "info"
    format: "json"

---
# Testing Instructions for Scenario 15

## Setup

### 1. Download GeoIP Database

#### Option A: MaxMind GeoLite2 (Free)
```bash
# Register for free account at https://dev.maxmind.com/geoip/geolite2-free-geolocation-data

# Download GeoLite2-City database
curl -o /tmp/GeoLite2-City.tar.gz \
  "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=YOUR_LICENSE_KEY&suffix=tar.gz"

# Extract
mkdir -p /var/lib/GeoIP
tar -xzf /tmp/GeoLite2-City.tar.gz -C /var/lib/GeoIP --strip-components=1

# Verify
ls -lh /var/lib/GeoIP/GeoLite2-City.mmdb
```

#### Option B: IP2Location (Free/Commercial)
```bash
# Download from https://www.ip2location.com/
# Requires DB5+ package for lat/lon coordinates

# For testing, download IP2Location LITE database
wget https://download.ip2location.com/lite/IP2LOCATION-LITE-DB5.BIN.ZIP
unzip IP2LOCATION-LITE-DB5.BIN.ZIP
mkdir -p /var/lib/IP2Location
mv IP2LOCATION-LITE-DB5.BIN /var/lib/IP2Location/

# Update config to use IP2Location:
# geoip_provider: "ip2location"
# geoip_db_path: "/var/lib/IP2Location/IP2LOCATION-LITE-DB5.BIN"
```

### 2. Start Backend Servers
```bash
# US East (8081)
python3 -m http.server 8081 &

# Europe (8082)
python3 -m http.server 8082 &

# Asia Pacific (8083)
python3 -m http.server 8083 &
```

### 3. Start Gateway
```bash
./highper-gateway -c configs/scenarios/scenario-15-geographic-routing.yaml
```

## Test Cases

### 1. Request from US IP
```bash
# Simulate request from US East Coast (e.g., 4.2.2.2 - Level 3 Communications)
curl -i http://geo.loadtest.local:8080/api/test \
  -H "X-Forwarded-For: 4.2.2.2"

# Expected: Routed to backend 8081 (US East - closest)
# Check logs for: "Selected nearest server 0 at distance X.XX km"
```

### 2. Request from Europe IP
```bash
# Simulate request from UK (e.g., 151.101.1.1 - Fastly CDN)
curl -i http://geo.loadtest.local:8080/api/test \
  -H "X-Forwarded-For: 151.101.1.1"

# Expected: Routed to backend 8082 (Europe - closest)
# Check logs for: "Selected nearest server 1 at distance X.XX km"
```

### 3. Request from Asia IP
```bash

# Scenario 12: Microservices Gateway with Service Discovery
# API Gateway with service discovery, circuit breaker, and retry logic
# Target: 450K+ RPS with dynamic service routing

https://microservices.loadtest.local {
    # TLS configuration
    tls cert=/etc/highper/certs/microservices.crt key=/etc/highper/certs/microservices.key
    tls_protocols TLSv1.2 TLSv1.3

    # HTTP/2 for microservices
    http2 enabled

    # Service discovery (placeholder - will use static for load test)
    # discovery consul address=localhost:8500 datacenter=dc1
    # discovery etcd endpoints=localhost:2379
    # discovery kubernetes namespace=default

    # Backend microservices (static for load testing)
    proxy BACKEND_1:8080 BACKEND_2:8080 BACKEND_3:8080

    # Intelligent load balancing
    lb least_conn
    health interval=5s path="/health" timeout=3s

    # Circuit breaker per backend
    circuit_breaker enabled
    circuit_breaker_threshold 10
    circuit_breaker_timeout 30s
    circuit_breaker_window 60s

    # Retry logic
    retry enabled
    retry_attempts 3
    retry_timeout 1s
    retry_on error timeout http_500 http_502 http_503

    # Timeout hierarchy
    request_timeout 30s
    connect_timeout 5s
    keepalive 60s

    # Rate limiting per service
    rate_limit 500000 burst=70000

    # Connection pooling
    pool min_idle=500 max_idle=25000 max_open=700000

    # Service mesh headers
    header_add X-Request-ID $request_id
    header_add X-Trace-ID $trace_id
    header_add X-Service-Name "gateway"
    header_passthrough X-B3-TraceId X-B3-SpanId X-B3-ParentSpanId

    # CORS for microservices
    cors origins=* methods=GET,POST,PUT,DELETE,PATCH

    # Compression
    compress gzip level=5

    # Distributed tracing
    tracing enabled
    tracing_sampler probabilistic rate=0.1
}

# Global settings
log info
metrics prometheus port=9090
buffer_pool enabled size=12288 pool_size=12582912
backpressure enabled max_conns=1500000 memory_limit=32768mb

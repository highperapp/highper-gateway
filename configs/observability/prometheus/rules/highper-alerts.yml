# Prometheus Alert Rules for Highper Gateway Load Testing
# Monitors performance degradation, errors, and resource saturation

groups:
  - name: highper_gateway_performance
    interval: 15s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            rate(highper_requests_total{status=~"5.."}[1m])
            /
            rate(highper_requests_total[1m])
          ) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      # High P99 latency
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, rate(highper_request_duration_seconds_bucket[5m])) > 0.010
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency exceeds target"
          description: "P99 latency is {{ $value | humanizeDuration }} (target: <10ms)"

      # Low throughput
      - alert: LowThroughput
        expr: |
          rate(highper_requests_total[1m]) < 400000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Throughput below target"
          description: "Current RPS: {{ $value | humanize }} (target: 600K+)"

      # Connection pool exhaustion
      - alert: ConnectionPoolExhaustion
        expr: |
          (
            highper_connection_pool_active
            /
            highper_connection_pool_max
          ) > 0.9
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Connection pool near capacity"
          description: "Pool utilization: {{ $value | humanizePercentage }}"

  - name: system_resources
    interval: 15s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage: {{ $value | humanizePercentage }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            /
            node_memory_MemTotal_bytes
          ) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage: {{ $value | humanizePercentage }}"

      # High network errors
      - alert: HighNetworkErrors
        expr: |
          rate(node_network_receive_errs_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High network errors on {{ $labels.instance }}"
          description: "Network errors: {{ $value | humanize }}/sec"

      # File descriptor exhaustion
      - alert: FileDescriptorExhaustion
        expr: |
          (
            process_open_fds
            /
            process_max_fds
          ) > 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "File descriptor usage high"
          description: "FD usage: {{ $value | humanizePercentage }}"

  - name: backend_health
    interval: 15s
    rules:
      # Backend down
      - alert: BackendDown
        expr: |
          up{job="rust-backends"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend {{ $labels.instance }} is down"
          description: "Backend server not responding to health checks"

      # Backend high latency
      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.99, rate(backend_request_duration_seconds_bucket[5m])) > 0.005
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Backend {{ $labels.instance }} has high latency"
          description: "P99 latency: {{ $value | humanizeDuration }}"

version: '3.8'

# Local Load Balancing Test Environment
# This docker-compose setup allows testing load balancing without cloud infrastructure
#
# Usage:
#   docker-compose -f docker-compose.loadtest.yml up
#   Test: curl http://localhost:8080/
#   Metrics: curl http://localhost:9090/metrics
#   Admin API: curl http://localhost:9090/admin/health
#
# To stop: docker-compose -f docker-compose.loadtest.yml down

services:
  # Backend Services (3 replicas)
  backend1:
    image: python:3.11-slim
    container_name: loadtest-backend1
    command: |
      python3 -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import socket
      hostname = 'backend1'
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/health':
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b'healthy')
              else:
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(f'Response from {hostname}\\n'.encode())
          def log_message(self, format, *args):
              pass  # Suppress logs
      print(f'Backend {hostname} starting on port 8080...', flush=True)
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
      "
    networks:
      - loadtest
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend2:
    image: python:3.11-slim
    container_name: loadtest-backend2
    command: |
      python3 -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import socket
      hostname = 'backend2'
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/health':
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b'healthy')
              else:
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(f'Response from {hostname}\\n'.encode())
          def log_message(self, format, *args):
              pass
      print(f'Backend {hostname} starting on port 8080...', flush=True)
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
      "
    networks:
      - loadtest
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend3:
    image: python:3.11-slim
    container_name: loadtest-backend3
    command: |
      python3 -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import socket
      hostname = 'backend3'
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/health':
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b'healthy')
              else:
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(f'Response from {hostname}\\n'.encode())
          def log_message(self, format, *args):
              pass
      print(f'Backend {hostname} starting on port 8080...', flush=True)
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
      "
    networks:
      - loadtest
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Gateway (Load Balancer)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.loadtest
    container_name: loadtest-gateway
    ports:
      - "8080:8080"   # Main proxy port
      - "9090:9090"   # Admin API / Metrics
    volumes:
      - ./examples/docker-compose-lb.proxy:/config/gateway.proxy:ro
    command: start -c /config/gateway.proxy
    networks:
      - loadtest
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Load Generator (Vegeta)
  # Uncomment to run automated load test
  # vegeta:
  #   image: peterevans/vegeta:latest
  #   container_name: loadtest-vegeta
  #   networks:
  #     - loadtest
  #   depends_on:
  #     gateway:
  #       condition: service_healthy
  #   entrypoint: /bin/sh
  #   command: -c "sleep 5 && echo 'GET http://gateway:8080/' | vegeta attack -duration=30s -rate=100 | vegeta report"

networks:
  loadtest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  # Optional: Persist metrics data
  prometheus_data:

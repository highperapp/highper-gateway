# HTTP/3 Test Configuration
# This configuration enables HTTP/3 with address validation

server:
  # HTTP bindings
  bind:
    - "127.0.0.1:8080"

  # HTTPS bindings (TLS required for HTTP/3)
  tls_bind:
    - "127.0.0.1:8443"

  # Number of worker threads
  workers: "4"

  # Enable HTTP/1.1, HTTP/2, and HTTP/3
  protocols:
    - http1
    - http2
    - http3

  # HTTP/3 configuration
  http3:
    enabled: true
    bind: "127.0.0.1"
    port: 8443  # Same as HTTPS port (UDP for QUIC)
    enable_0rtt: true  # Enable 0-RTT for faster reconnections
    max_idle_timeout: 30000  # 30 seconds

  # Performance settings
  performance:
    max_connections: 10000
    connection_timeout: 60
    keep_alive_timeout: 60

  # Graceful shutdown
  shutdown_timeout: 30s

# TLS Configuration (required for HTTP/3)
tls:
  auto: false
  certificates:
    - domain: "localhost"
      cert_file: "/mnt/e/my-opensource/highper-gateway/tests/http3/certs/server.crt"
      key_file: "/mnt/e/my-opensource/highper-gateway/tests/http3/certs/server.key"

# Upstream backends
upstreams:
  - name: "http3_test_backends"
    servers:
      - url: "http://127.0.0.1:9001"
        weight: 1
      - url: "http://127.0.0.1:9002"
        weight: 1
      - url: "http://127.0.0.1:9003"
        weight: 1

    load_balancing:
      algorithm: "round_robin"  # Test with round-robin first

    # Connection settings
    connection:
      max_per_backend: 100
      connect_timeout: 10s
      timeout: 30s

# Routes
routes:
  - name: "root_route"
    match:
      paths: ["/"]
    upstream: "http3_test_backends"

  - name: "health_route"
    match:
      paths: ["/health"]
    upstream: "http3_test_backends"

  - name: "echo_route"
    match:
      paths: ["/echo"]
    upstream: "http3_test_backends"

# Observability
observability:
  metrics:
    enabled: true
    bind: "127.0.0.1:9090"
    path: "/metrics"

  logging:
    level: "debug"  # Verbose logging for testing
    format: "pretty"
    access_log: true

# WebSocket configuration (disabled for HTTP/3 tests)
websocket:
  enabled: false

# Admin API (disabled for tests)
admin:

# Cache (disabled for tests)
cache:

# Rate limiting (disabled for tests)
rate_limit:

# WAF (disabled for tests)
waf:

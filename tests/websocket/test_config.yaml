# WebSocket Integration Test Configuration

server:
  bind:
    - "127.0.0.1:8080"
  workers: 4
  protocols:
    - http1

# WebSocket configuration
websocket:
  enabled: true
  max_message_size: 16777216  # 16 MB
  ping_interval: 30
  timeout: 300
  sticky_sessions: true
  session_cookie_name: "HPGW_WS_SESSION"
  session_timeout: 3600
  track_connections: true
  idle_timeout: 600

# Upstream backends
upstreams:
  - name: "ws_test_backends"
    servers:
      - url: "ws://127.0.0.1:8081"
        weight: 1
      - url: "ws://127.0.0.1:8082"
        weight: 1
      - url: "ws://127.0.0.1:8083"
        weight: 1
    load_balancing:
      algorithm: "least_conn"
    health_check:
      enabled: true
      interval: 5
      timeout: 2
      max_failures: 3

# Routes
routes:
  - name: "websocket_test"
    match:
      paths:
        - "/*"
    upstream: "ws_test_backends"

# Logging
logging:
  level: "info"

# Metrics
metrics:
  enabled: true
  bind: "127.0.0.1:9090"

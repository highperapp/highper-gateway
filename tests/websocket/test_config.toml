# Test Configuration for WebSocket Integration Testing
# This configuration sets up the gateway for WebSocket testing

# Server configuration
[server]
bind = "127.0.0.1:8080"
workers = 4

# WebSocket configuration
[websocket]
enabled = true
max_message_size = 16777216  # 16 MB
ping_interval = 30
timeout = 300
sticky_sessions = true
session_cookie_name = "HPGW_WS_SESSION"
session_timeout = 3600
track_connections = true
idle_timeout = 600

# Load balancer configuration
[load_balancer]
algorithm = "least_connections"
health_check_interval = 5
health_check_timeout = 2
max_failures = 3

# Backends for WebSocket testing
[[routes]]
path = "/"
backends = [
    { url = "ws://127.0.0.1:8081", weight = 1 },
    { url = "ws://127.0.0.1:8082", weight = 1 },
    { url = "ws://127.0.0.1:8083", weight = 1 },
]

# Enable WebSocket upgrade
[routes.websocket]
enabled = true

# Logging configuration
[logging]
level = "info"
format = "json"

# Metrics configuration
[metrics]
enabled = true
port = 9090

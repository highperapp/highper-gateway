version: '3.8'

services:
  # WebSocket Backend 1
  ws-backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ws-backend-1
    ports:
      - "8081:8081"
    environment:
      - BACKEND_PORT=8081
      - BACKEND_NAME=backend-1
    networks:
      - ws-test
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8081)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3

  # WebSocket Backend 2
  ws-backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ws-backend-2
    ports:
      - "8082:8082"
    environment:
      - BACKEND_PORT=8082
      - BACKEND_NAME=backend-2
    networks:
      - ws-test
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8082)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3

  # WebSocket Backend 3
  ws-backend-3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ws-backend-3
    ports:
      - "8083:8083"
    environment:
      - BACKEND_PORT=8083
      - BACKEND_NAME=backend-3
    networks:
      - ws-test
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8083)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  ws-test:
    driver: bridge

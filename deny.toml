# Cargo deny configuration for Highper Gateway
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RSA timing sidechannel (RUSTSEC-2023-0071) - NO LONGER NEEDED
    # openidconnect (which depends on rsa crate) is now an optional 'oidc' feature.
    # Default builds do not include the vulnerable dependency.

    # Unmaintained crates - transitive dependencies, monitoring for replacements
    "RUSTSEC-2025-0141",  # bincode - used by transitive deps
    "RUSTSEC-2020-0077",  # memmap - transitive dep (via ip2location)
    "RUSTSEC-2025-0123",  # opentelemetry-jaeger - will migrate to OTLP
    "RUSTSEC-2025-0134",  # rustls-pemfile - transitive, will migrate
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "OpenSSL",
    # webpki-roots uses this data license
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[[licenses.clarify]]
name = "ip2location"
# ip2location is MIT licensed but missing the field in Cargo.toml
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

skip = [
    # Common duplicates that are expected in large dependency trees
    { name = "syn" },
    { name = "bitflags" },
    { name = "hashbrown" },
    { name = "indexmap" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Tier 3 Optimized Configuration
# Target: 50K req/s @ p99 < 25ms

server:
  bind: ["127.0.0.1:8080"]
  workers: "8"  # Increased from 4

  performance:
    max_connections: 10000
    backlog: 8192

  shutdown_timeout: "30s"

# Upstream backend definitions
upstreams:
  - name: "backend"
    servers:
      - url: "http://127.0.0.1:8081"
        weight: 100
        max_conns: 5000

    connection:
      pool_size: 1000  # Pre-warm connection pool
      max_idle_per_host: 500
      idle_timeout: "90s"
      connect_timeout: "5s"
      request_timeout: "30s"

    load_balancing:
      algorithm: "round_robin"

# Route definitions
routes:
  - name: "catch-all"
    match:
      paths: ["/"]
    upstream: "backend"

    timeout:
      connect: "5s"
      request: "30s"
      idle: "90s"

# Observability settings
observability:
  metrics:
    enabled: true
    port: 9090

  logging:
    level: "warn"
    format: "json"

  tracing:
    enabled: false  # Disable tracing for max performance

# Admin API
admin:
  enabled: true
  port: 8888
  auth:
    enabled: false

# WAF-Protected Gateway Configuration
#
# This configuration sets up a Web Application Firewall (WAF) protected gateway with:
# - OWASP Core Rule Set (CRS) protection
# - SQL injection prevention
# - XSS attack prevention
# - Request body inspection
# - Anomaly scoring
#
# Environment variables:
# - WEB_BACKEND: Web application backend (e.g., webapp.internal:8080)
# - TLS_CERT_PATH: Path to TLS certificate
# - TLS_KEY_PATH: Path to TLS private key

server:
  bind:
    - "0.0.0.0:8080"
  tls_bind:
    - "0.0.0.0:8443"
  workers: auto
  protocols:
    - http1
    - http2
  performance:
    read_buffer_size: 8192
    write_buffer_size: 8192
    max_connections: 100000
    max_requests_per_connection: 1000
    connect_timeout: 5s
    request_timeout: 30s
    idle_timeout: 90s
    connection_pool:
      max_idle_per_host: 100
      min_idle_per_host: 0
      max_connection_lifetime: null
      idle_timeout: 90s
      prewarm: false
      metrics_enabled: true
  shutdown_timeout: 30s

tls:
  auto: false
  certificates:
    - cert: "${TLS_CERT_PATH}"
      key: "${TLS_KEY_PATH}"
  min_version: "1.2"

# WAF configuration
waf:
  enabled: true
  mode: "blocking"  # Can be: "detection", "blocking", "off"
  provider: "modsecurity"  # or "coraza", "aws_waf"
  modsecurity:
    rules_path: "/etc/modsecurity/rules"
    audit_log: "/var/log/modsecurity/audit.log"
    audit_log_parts: "ABCDEFGHZ"
    request_body_limit: 1048576  # 1 MB
    anomaly_scoring:
      threshold: 5  # Block if anomaly score >= 5
      inbound_threshold: 5
      outbound_threshold: 4
    paranoia_level: 1  # 1-4, higher = more strict
    crs_version: "3.3"
    custom_rules:
      # Example custom rules
      - id: 90001
        phase: 1
        action: "deny"
        msg: "Block requests with suspicious User-Agent"
        rule: |
          SecRule REQUEST_HEADERS:User-Agent "@rx (?:bot|crawler|spider|scraper)" \
            "id:90001,phase:1,deny,status:403,msg:'Suspicious User-Agent detected'"

upstreams:
  - name: web-backend
    servers:
      - address: "${WEB_BACKEND}"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_check:
        path: "/health"
        expected_status: 200

routes:
  - path: "/"
    upstream: web-backend
    middlewares:
      - waf
      - security_headers
      - rate_limit

rate_limit:
  enabled: true
  algorithm: token_bucket
  capacity: 1000
  refill_rate: 100
  window: 60s
  key_type: ip
  cleanup_interval: 60s

observability:
  metrics:
    enabled: true
    bind: "0.0.0.0:9090"
    endpoint: "/metrics"
    port: 9090
  logging:
    level: info
    format: json
    output: stdout
    protocols:
      http: info
  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1

admin:
  enabled: true
  bind: "127.0.0.1:9000"
  auth_enabled: true
  api_keys:
    - "${ADMIN_API_KEY}"
  cors_enabled: false
  read_only: false

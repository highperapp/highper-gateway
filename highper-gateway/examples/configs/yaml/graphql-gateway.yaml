# GraphQL Gateway Configuration
#
# This configuration sets up a GraphQL API gateway with:
# - Query depth and complexity limiting
# - Schema stitching support
# - Query batching
# - Response caching
# - Subscription support (WebSocket)
#
# Environment variables:
# - GRAPHQL_BACKEND_1: First GraphQL server (e.g., graphql1.internal:4000)
# - GRAPHQL_BACKEND_2: Second GraphQL server (e.g., graphql2.internal:4000)
# - TLS_CERT_PATH: Path to TLS certificate
# - TLS_KEY_PATH: Path to TLS private key

server:
  bind:
    - "0.0.0.0:8080"
  tls_bind:
    - "0.0.0.0:8443"
  workers: auto
  protocols:
    - http1
    - http2
  performance:
    read_buffer_size: 8192
    write_buffer_size: 8192
    max_connections: 100000
    max_requests_per_connection: 1000
    connect_timeout: 5s
    request_timeout: 30s
    idle_timeout: 90s
    connection_pool:
      max_idle_per_host: 100
      min_idle_per_host: 0
      max_connection_lifetime: null
      idle_timeout: 90s
      prewarm: false
      metrics_enabled: true
  shutdown_timeout: 30s

tls:
  auto: false
  certificates:
    - cert: "${TLS_CERT_PATH}"
      key: "${TLS_KEY_PATH}"
  min_version: "1.2"

graphql:
  enabled: true
  endpoint: "/graphql"
  playground_enabled: false  # Disable in production
  introspection_enabled: false  # Disable in production for security
  query_depth_limit: 10
  query_complexity_limit: 1000
  enable_subscriptions: true
  subscription_protocol: "graphql-ws"

upstreams:
  - name: graphql-backend
    servers:
      - address: "${GRAPHQL_BACKEND_1}"
        weight: 1
      - address: "${GRAPHQL_BACKEND_2}"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_check:
        path: "/health"
        expected_status: 200

routes:
  - path: "/graphql"
    upstream: graphql-backend
    methods:
      - GET
      - POST
    middlewares:
      - cors
      - rate_limit
      - security_headers
      - cache

# Shorter TTL for GraphQL responses (queries change frequently)
cache:
  enabled: true
  default_ttl: 60s  # 1 minute
  max_size: 10000
  cleanup_interval: 60s
  cache_only_success: true
  methods:
    - GET
    - POST  # Cache GraphQL queries (but not mutations)
  key_headers:
    - Authorization
    - Content-Type

# Rate limiting per client
rate_limit:
  enabled: true
  algorithm: token_bucket
  capacity: 1000
  refill_rate: 100
  window: 60s
  key_type: ip
  cleanup_interval: 60s

observability:
  metrics:
    enabled: true
    bind: "0.0.0.0:9090"
    endpoint: "/metrics"
    port: 9090
  logging:
    level: info
    format: json
    output: stdout
    protocols:
      graphql: debug
      http: info
  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1

admin:
  enabled: true
  bind: "127.0.0.1:9000"
  auth_enabled: true
  api_keys:
    - "${ADMIN_API_KEY}"
  cors_enabled: true
  cors_origins:
    - "http://localhost:3000"
  read_only: false

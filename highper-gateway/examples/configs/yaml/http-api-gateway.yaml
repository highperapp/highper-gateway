# HTTP/HTTPS API Gateway Configuration
#
# This configuration sets up a production-ready REST API gateway with:
# - TLS termination
# - Response caching
# - Rate limiting
# - Security headers
# - Compression
# - CORS support
#
# Environment variables:
# - API_BACKEND_1: First API server (e.g., api1.internal:8080)
# - API_BACKEND_2: Second API server (e.g., api2.internal:8080)
# - TLS_CERT_PATH: Path to TLS certificate
# - TLS_KEY_PATH: Path to TLS private key

server:
  bind:
    - "0.0.0.0:8080"
  tls_bind:
    - "0.0.0.0:8443"
  workers: auto
  protocols:
    - http1
    - http2
  performance:
    read_buffer_size: 8192
    write_buffer_size: 8192
    max_connections: 100000
    max_requests_per_connection: 1000
    connect_timeout: 5s
    request_timeout: 30s
    idle_timeout: 90s
    connection_pool:
      max_idle_per_host: 100
      min_idle_per_host: 0
      max_connection_lifetime: null
      idle_timeout: 90s
      prewarm: false
      metrics_enabled: true
  shutdown_timeout: 30s

tls:
  auto: false
  certificates:
    - cert: "${TLS_CERT_PATH}"
      key: "${TLS_KEY_PATH}"
  min_version: "1.2"

upstreams:
  - name: api-backend
    servers:
      - address: "${API_BACKEND_1}"
        weight: 1
      - address: "${API_BACKEND_2}"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_check:
        path: "/health"
        expected_status: 200

routes:
  - path: "/api/v1"
    upstream: api-backend
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
    middlewares:
      - cors
      - rate_limit
      - security_headers
      - cache

# Response caching for GET requests
cache:
  enabled: true
  default_ttl: 300s  # 5 minutes
  max_size: 10000
  cleanup_interval: 60s
  cache_only_success: true
  methods:
    - GET
    - HEAD
  key_headers:
    - Authorization  # Include in cache key for user-specific responses

# Rate limiting to prevent abuse
rate_limit:
  enabled: true
  algorithm: token_bucket
  capacity: 1000  # 1000 requests
  refill_rate: 100  # 100 requests per second
  window: 60s
  key_type: ip  # Rate limit by client IP
  cleanup_interval: 60s

observability:
  metrics:
    enabled: true
    bind: "0.0.0.0:9090"
    endpoint: "/metrics"
    port: 9090
  logging:
    level: info
    format: json
    output: stdout
    protocols:
      http: info
      tls: info
  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1  # Sample 10% of requests

admin:
  enabled: true
  bind: "127.0.0.1:9000"
  auth_enabled: true
  api_keys:
    - "${ADMIN_API_KEY}"
  cors_enabled: true
  cors_origins:
    - "http://localhost:3000"
  read_only: false

# HTTP/3 Edge Server Configuration
#
# This configuration sets up a modern HTTP/3 edge server with:
# - QUIC protocol for best performance
# - 0-RTT for ultra-low latency
# - Connection migration
# - Auto-ACME for TLS certificates
# - Modern security standards
#
# Environment variables:
# - BACKEND_SERVER: Backend origin server (e.g., origin.internal:8080)
# - ACME_EMAIL: Email for Let's Encrypt notifications

server:
  bind: []  # HTTP/3 uses QUIC (UDP-based)
  tls_bind:
    - "0.0.0.0:443"
  workers: auto
  protocols:
    - http1  # Fallback
    - http2  # Fallback
    - http3  # Primary protocol
  performance:
    read_buffer_size: 8192
    write_buffer_size: 8192
    max_connections: 100000
    max_requests_per_connection: 1000
    connect_timeout: 5s
    request_timeout: 30s
    idle_timeout: 90s
    connection_pool:
      max_idle_per_host: 100
      min_idle_per_host: 0
      max_connection_lifetime: null
      idle_timeout: 90s
      prewarm: false
      metrics_enabled: true
  shutdown_timeout: 30s
  http3:
    enabled: true
    port: 443
    bind: "0.0.0.0"
    enable_0rtt: true  # Enable for best performance
    max_concurrent_streams: 100
    initial_window_size: 10485760  # 10 MB
    max_datagram_size: 1350
    idle_timeout_secs: 30

# Auto-ACME for automatic TLS certificate management
tls:
  auto: true
  acme:
    provider: "letsencrypt"
    email: "${ACME_EMAIL}"
    directory_url: "https://acme-v02.api.letsencrypt.org/directory"
    challenge_type: "http-01"
    storage:
      type: "file"
      path: "/var/lib/highper-gateway/acme"
    renewal_days: 30
    renew_check_interval: 3600s
  min_version: "1.3"  # TLS 1.3 required for HTTP/3
  ocsp_stapling:
    enabled: true

upstreams:
  - name: backend-origin
    servers:
      - address: "${BACKEND_SERVER}"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_check:
        path: "/health"
        expected_status: 200

routes:
  - path: "/"
    upstream: backend-origin
    middlewares:
      - cache
      - compression
      - security_headers

# Edge caching
cache:
  enabled: true
  default_ttl: 300s  # 5 minutes
  max_size: 10000
  cleanup_interval: 60s
  cache_only_success: true
  methods:
    - GET
    - HEAD
  key_headers: []

observability:
  metrics:
    enabled: true
    bind: "0.0.0.0:9090"
    endpoint: "/metrics"
    port: 9090
  logging:
    level: info
    format: json
    output: stdout
    protocols:
      http: info
      quic: debug  # Detailed QUIC logging
      tls: info
  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1

admin:
  enabled: true
  bind: "127.0.0.1:9000"
  auth_enabled: true
  api_keys:
    - "${ADMIN_API_KEY}"
  cors_enabled: false
  read_only: false

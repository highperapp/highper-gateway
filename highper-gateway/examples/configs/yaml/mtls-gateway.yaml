# Mutual TLS (mTLS) Gateway Configuration
#
# This configuration sets up a zero-trust gateway with mutual TLS:
# - Client certificate authentication
# - Certificate validation and revocation checking
# - Fine-grained access control based on client certificates
# - OCSP stapling for certificate status
#
# Environment variables:
# - BACKEND_SERVER: Backend server (e.g., secure-api.internal:8080)
# - TLS_CERT_PATH: Path to server TLS certificate
# - TLS_KEY_PATH: Path to server TLS private key
# - MTLS_CA_CERT: Path to CA certificate for client validation
# - MTLS_CRL_PATH: Path to Certificate Revocation List (optional)

server:
  bind: []  # mTLS requires TLS
  tls_bind:
    - "0.0.0.0:8443"
  workers: auto
  protocols:
    - http1
    - http2
  performance:
    read_buffer_size: 8192
    write_buffer_size: 8192
    max_connections: 10000
    max_requests_per_connection: 1000
    connect_timeout: 5s
    request_timeout: 30s
    idle_timeout: 90s
    connection_pool:
      max_idle_per_host: 100
      min_idle_per_host: 10
      max_connection_lifetime: 1800s
      idle_timeout: 90s
      prewarm: true
      metrics_enabled: true
  shutdown_timeout: 30s

# Mutual TLS configuration
tls:
  auto: false
  certificates:
    - cert: "${TLS_CERT_PATH}"
      key: "${TLS_KEY_PATH}"
  min_version: "1.2"
  # Enable mutual TLS
  mtls:
    enabled: true
    ca_cert: "${MTLS_CA_CERT}"
    verify_client: true  # Require valid client certificate
    verify_depth: 3  # Maximum certificate chain depth
    crl_file: "${MTLS_CRL_PATH}"  # Optional: Certificate Revocation List
  # OCSP stapling for certificate status
  ocsp_stapling:
    enabled: true
    cache_timeout: 3600s
    responder_timeout: 5s

upstreams:
  - name: secure-backend
    servers:
      - address: "${BACKEND_SERVER}"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_check:
        path: "/health"
        expected_status: 200

routes:
  # All routes require valid client certificate
  - path: "/"
    upstream: secure-backend
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    middlewares:
      - mtls_validation
      - rate_limit
      - security_headers

rate_limit:
  enabled: true
  algorithm: token_bucket
  capacity: 1000
  refill_rate: 100
  window: 60s
  key_type: ip  # Or use client certificate CN/SAN
  cleanup_interval: 60s

observability:
  metrics:
    enabled: true
    bind: "0.0.0.0:9090"
    endpoint: "/metrics"
    port: 9090
  logging:
    level: info
    format: json
    output: stdout
    protocols:
      http: info
      tls: debug  # Detailed TLS/mTLS logging
  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 1.0  # Sample all mTLS requests

admin:
  enabled: true
  bind: "127.0.0.1:9000"
  auth_enabled: true
  api_keys:
    - "${ADMIN_API_KEY}"
  cors_enabled: false
  read_only: false

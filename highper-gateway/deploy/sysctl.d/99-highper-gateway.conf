# Highper Gateway - Kernel Parameter Tuning for Extreme Scale
# Target: 3+ million concurrent connections with 600-800K RPS
# Apply with: sudo cp deploy/sysctl.d/99-highper-gateway.conf /etc/sysctl.d/
#             sudo sysctl -p /etc/sysctl.d/99-highper-gateway.conf

# ============================================================================
# FILE DESCRIPTOR LIMITS
# ============================================================================
# Support 3M+ connections (each connection requires 1 file descriptor)
# Plus overhead for files, pipes, sockets, etc.
fs.file-max = 10000000
fs.nr_open = 10000000

# ============================================================================
# TCP CONNECTION LIMITS
# ============================================================================
# Maximum number of pending connections in the listen queue
# Protects against SYN flood attacks and handles burst traffic
net.core.somaxconn = 65535

# Maximum number of connections in SYN_RECV state (half-open connections)
# Increase for high-traffic scenarios and DDoS protection
net.ipv4.tcp_max_syn_backlog = 65535

# ============================================================================
# TCP MEMORY LIMITS
# ============================================================================
# Format: min default max (in pages, 1 page = 4KB)
# Calculation for 3M connections:
#   - 3M connections × 16KB per connection = 48GB
#   - 48GB / 4KB per page = 12M pages
#   - Adding 100% overhead for buffers: 24M pages

# Global TCP memory allocation (min, default, max in pages)
net.ipv4.tcp_mem = 786432 1048576 26777216

# Per-socket receive buffer (min, default, max in bytes)
# Min: 4KB, Default: 87KB, Max: 16MB
net.ipv4.tcp_rmem = 4096 87380 16777216

# Per-socket send buffer (min, default, max in bytes)
# Min: 4KB, Default: 65KB, Max: 16MB
net.ipv4.tcp_wmem = 4096 65536 16777216

# ============================================================================
# CONNECTION RECYCLING (Critical for high throughput)
# ============================================================================
# Reuse TIME_WAIT sockets for new outbound connections
# CRITICAL: Without this, you'll exhaust ports after ~64K connections
net.ipv4.tcp_tw_reuse = 1

# Reduce TIME_WAIT duration from default 60s to 30s
# Faster port recycling for high-throughput scenarios
net.ipv4.tcp_fin_timeout = 30

# Maximum number of sockets in TIME_WAIT state
# Prevent port exhaustion on high-traffic proxies
net.ipv4.tcp_max_tw_buckets = 2000000

# ============================================================================
# SYN COOKIES (DDoS Protection)
# ============================================================================
# Enable SYN cookies to prevent SYN flood attacks
# When SYN queue is full, use cryptographic cookies instead of queue
net.ipv4.tcp_syncookies = 1

# Reduce SYN retries (faster failure detection)
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2

# ============================================================================
# TCP FAST OPEN (Performance)
# ============================================================================
# Enable TCP Fast Open on client and server
# Reduces connection setup by 1 RTT (saves ~50ms per connection)
# 0 = disabled, 1 = client only, 2 = server only, 3 = client and server
net.ipv4.tcp_fastopen = 3

# Queue length for TFO requests (server-side)
net.ipv4.tcp_fastopen_blackhole_timeout_sec = 3600

# ============================================================================
# KEEPALIVE TUNING (Connection Health)
# ============================================================================
# Time before sending first keepalive probe (seconds)
# Detect dead connections faster (default is 7200s = 2 hours)
net.ipv4.tcp_keepalive_time = 60

# Interval between keepalive probes (seconds)
net.ipv4.tcp_keepalive_intvl = 10

# Number of keepalive probes before declaring connection dead
net.ipv4.tcp_keepalive_probes = 3

# ============================================================================
# NETWORK BUFFERS
# ============================================================================
# Maximum receive buffer size for all protocols (bytes)
net.core.rmem_max = 134217728  # 128MB

# Maximum send buffer size for all protocols (bytes)
net.core.wmem_max = 134217728  # 128MB

# Default receive buffer size (bytes)
net.core.rmem_default = 262144  # 256KB

# Default send buffer size (bytes)
net.core.wmem_default = 262144  # 256KB

# ============================================================================
# BACKLOG QUEUES (Network Stack)
# ============================================================================
# Maximum number of packets queued on INPUT side
# Increase for high packet rates
net.core.netdev_max_backlog = 65535

# Budget for packet processing per NAPI poll cycle
# Higher = more packets processed per interrupt (better throughput)
net.core.netdev_budget = 600

# Time limit for packet processing per NAPI cycle (microseconds)
net.core.netdev_budget_usecs = 8000

# ============================================================================
# EPHEMERAL PORT RANGE
# ============================================================================
# Range of ports for outbound connections
# Default: 32768-60999 (28K ports)
# Increased: 10000-65535 (55K ports)
# Critical for proxies making many outbound connections
net.ipv4.ip_local_port_range = 10000 65535

# ============================================================================
# CONNECTION TRACKING (Firewall/NAT)
# ============================================================================
# Maximum number of connections to track
# Only needed if using iptables/nftables
# If not using firewall, consider disabling conntrack entirely for performance
net.netfilter.nf_conntrack_max = 10485760

# Timeout for ESTABLISHED connections (seconds)
# Default is 5 days, reduce for faster cleanup
net.netfilter.nf_conntrack_tcp_timeout_established = 1200  # 20 minutes

# Timeout for TIME_WAIT connections (seconds)
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================
# Overcommit memory (allow more allocations than physical RAM)
# 0 = heuristic, 1 = always allow, 2 = never allow
# Use 1 for high-concurrency applications
vm.overcommit_memory = 1

# Percentage of RAM that can be overcommitted (when mode = 2)
vm.overcommit_ratio = 100

# Reduce swappiness (avoid swapping active connections to disk)
# 0 = avoid swapping, 100 = swap aggressively
# Use 10 for latency-sensitive applications
vm.swappiness = 10

# Percentage of memory that can contain dirty pages before blocking writes
vm.dirty_ratio = 40

# Percentage of memory to trigger background writeback
vm.dirty_background_ratio = 10

# Maximum dirty pages (bytes) - helps prevent memory pressure
vm.dirty_bytes = 0  # 0 = use dirty_ratio instead
vm.dirty_background_bytes = 0  # 0 = use dirty_background_ratio instead

# ============================================================================
# TRANSPARENT HUGE PAGES (Optional - Advanced)
# ============================================================================
# Reduces TLB misses for large memory workloads
# Disabled by default - enable if running on dedicated hardware with >128GB RAM
# vm.nr_hugepages = 1024  # Allocate 2GB of huge pages (1024 × 2MB)
# Note: Uncomment above line if you want to enable huge pages

# ============================================================================
# NUMA AWARENESS (Multi-Socket Servers)
# ============================================================================
# Prefer local memory allocation (reduces cross-NUMA latency)
# 0 = disabled, 1 = enabled
# Only effective on NUMA systems (multi-socket servers)
vm.zone_reclaim_mode = 1

# ============================================================================
# TCP CONGESTION CONTROL
# ============================================================================
# BBR (Bottleneck Bandwidth and RTT) - modern congestion control
# Better throughput and lower latency than CUBIC (default)
# Available in Linux 4.9+
net.ipv4.tcp_congestion_control = bbr

# Enable ECN (Explicit Congestion Notification)
# Improves throughput under congestion
# 0 = disabled, 1 = enabled for incoming, 2 = enabled for both
net.ipv4.tcp_ecn = 1

# ============================================================================
# TCP WINDOW SCALING
# ============================================================================
# Enable TCP window scaling (required for high-bandwidth networks)
net.ipv4.tcp_window_scaling = 1

# Enable TCP timestamps (helps with RTT calculation)
net.ipv4.tcp_timestamps = 1

# Enable selective acknowledgments (SACK) for better packet recovery
net.ipv4.tcp_sack = 1

# ============================================================================
# SECURITY HARDENING
# ============================================================================
# Disable ICMP redirect acceptance (security)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Disable source packet routing (security)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enable reverse path filtering (anti-spoofing)
# 0 = disabled, 1 = strict, 2 = loose
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martian packets (packets with impossible addresses)
net.ipv4.conf.all.log_martians = 0  # Disable logging to reduce I/O

# ============================================================================
# IPv6 (Disable if not using IPv6)
# ============================================================================
# Uncomment to disable IPv6 if not needed (saves resources)
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1
# net.ipv6.conf.lo.disable_ipv6 = 1

# ============================================================================
# VERIFICATION COMMANDS
# ============================================================================
# After applying, verify with:
#   sysctl fs.file-max
#   sysctl net.core.somaxconn
#   sysctl net.ipv4.tcp_tw_reuse
#   sysctl net.ipv4.tcp_fin_timeout
#   sysctl net.ipv4.tcp_congestion_control
#
# Monitor current values:
#   cat /proc/sys/net/ipv4/tcp_mem
#   cat /proc/sys/fs/file-max
#   ss -s  # Show socket statistics
#
# View current connections by state:
#   ss -tan | awk '{print $1}' | sort | uniq -c

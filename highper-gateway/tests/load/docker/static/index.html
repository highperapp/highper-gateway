<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highper Gateway Load Test Backend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .info { margin-top: 2rem; font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Highper Gateway</h1>
        <p>High-Performance Gateway Load Test Backend</p>
        <div class="info">
            <p>Backend Server: <span id="hostname">Loading...</span></p>
            <p>Request ID: <span id="request-id">Loading...</span></p>
        </div>
    </div>
    <script>
        // Display backend info from response headers
        fetch('/api/ping')
            .then(r => {
                document.getElementById('hostname') = r.headers.get('X-Backend-Host') || 'Unknown';
                document.getElementById('request-id') = r.headers.get('X-Request-ID') || 'Unknown';
                return r.json();
            })
            .catch(() => {
                document.getElementById('hostname').textContent = 'Error';
                document.getElementById('request-id').textContent = 'Error';
            });
    </script>
</body>
</html>

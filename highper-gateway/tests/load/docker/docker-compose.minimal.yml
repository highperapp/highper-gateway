# Minimal Docker Compose for quick HTTP load testing
# Only includes gateway and backends - no extra services

networks:
  loadtest:
    driver: bridge

services:
  # Backend 1
  backend-http-1:
    build:
      context: ./backends/rust-http
      dockerfile: Dockerfile
    container_name: backend-http-1
    networks:
      - loadtest
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - HOSTNAME=backend-http-1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend 2
  backend-http-2:
    build:
      context: ./backends/rust-http
      dockerfile: Dockerfile
    container_name: backend-http-2
    networks:
      - loadtest
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      - HOSTNAME=backend-http-2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend 3
  backend-http-3:
    build:
      context: ./backends/rust-http
      dockerfile: Dockerfile
    container_name: backend-http-3
    networks:
      - loadtest
    ports:
      - "8003:8000"
    environment:
      - PORT=8000
      - HOSTNAME=backend-http-3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Highper Gateway
  gateway:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    container_name: highper-gateway
    networks:
      - loadtest
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9090:9090"
    volumes:
      - ./configs/gateway-minimal.toml:/etc/highper-gateway/config.toml:ro
      - ./certs:/etc/highper-gateway/certs:ro
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - backend-http-1
      - backend-http-2
      - backend-http-3
    restart: unless-stopped

# Nginx backend configuration for load testing
# Optimized for high-throughput testing

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Access logging disabled for performance
    access_log off;
    error_log /var/log/nginx/error.log error;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable sendfile for static files
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive
    keepalive_timeout 75;
    keepalive_requests 1000;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-backend"}\n';
        add_header Content-Type application/json;
    }

    # API endpoints (simple JSON responses)
    location /api/ {
        default_type application/json;
        return 200 '{"message":"OK","timestamp":"$msec","backend":"$hostname"}\n';
        add_header X-Backend-Host $hostname;
        add_header X-Request-ID $request_id;
    }

    # Static file serving
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Small response (1KB)
    location /small {
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }

    # Medium response (10KB)
    location /medium {
        return 200 '{"data":"$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id"}\n';
        add_header Content-Type application/json;
    }

    # Large response (100KB placeholder)
    location /large {
        alias /usr/share/nginx/html/large.json;
        add_header Content-Type application/json;
    }

    # Simulate slow endpoint (500ms delay)
    location /slow {
        echo_sleep 0.5;
        return 200 '{"message":"slow response"}\n';
        add_header Content-Type application/json;
    }

    # Default location
    location / {
        try_files $uri $uri/ =404;
    }
}

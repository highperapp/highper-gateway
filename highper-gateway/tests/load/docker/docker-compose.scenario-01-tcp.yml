# Scenario 01: Layer 4 TCP - Pure TCP Proxying
# Protocol: TCP
# Focus: Zero-copy forwarding, connection pooling
# Target: 500K+ connections/sec

version: '3.8'

services:
  # Use base gateway with TCP-specific configuration
  gateway:
    environment:
      - SCENARIO=01-tcp-proxy
      - TCP_ENABLED=true
      - TCP_PORT=9000
      - TCP_BUFFER_SIZE=65536
      - TCP_NODELAY=true

  # TCP backend (PostgreSQL as example)
  postgres-backend:
    image: postgres:15-alpine
    container_name: postgres-backend
    networks:
      loadtest:
        ipv4_address: 172.20.0.50
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=loadtest
      - POSTGRES_USER=loadtest
      - POSTGRES_PASSWORD=loadtest123
      - POSTGRES_MAX_CONNECTIONS=1000
    command: >
      postgres
      -c max_connections=1000
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  loadtest:
    external: true

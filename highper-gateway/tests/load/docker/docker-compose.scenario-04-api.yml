# Scenario 04: API Gateway - REST APIs, CORS, Rate Limiting
# Protocol: HTTPS
# Focus: Rate limiting, CORS, request validation, caching
# Target: 100K+ req/s with security overhead

version: '3.8'

services:
  # Use base gateway with API-specific configuration
  gateway:
    environment:
      - SCENARIO=04-api-gateway
      - HTTPS_ENABLED=true
      - HTTPS_PORT=8443
      - RATE_LIMITING_ENABLED=true
      - RATE_LIMIT_RPS=10000
      - CORS_ENABLED=true
      - REQUEST_VALIDATION_ENABLED=true
      - CACHING_ENABLED=true
      - CACHE_TTL=300

  # Additional API backends for redundancy
  backend-api-2:
    image: node:18-alpine
    container_name: backend-api-2
    networks:
      loadtest:
        ipv4_address: 172.20.0.31
    ports:
      - "3001:3000"
    working_dir: /app
    volumes:
      - ./backends/node-api:/app:ro
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=backend-api-2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend-api-3:
    image: node:18-alpine
    container_name: backend-api-3
    networks:
      loadtest:
        ipv4_address: 172.20.0.32
    ports:
      - "3002:3000"
    working_dir: /app
    volumes:
      - ./backends/node-api:/app:ro
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=backend-api-3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  loadtest:
    external: true

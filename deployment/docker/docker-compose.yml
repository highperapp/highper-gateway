version: '3.8'

services:
  # Rust Reverse Proxy
  highper-gateway:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: highper-gateway:latest
    container_name: highper-gateway
    restart: unless-stopped

    # Ports
    ports:
      - "80:8080"      # HTTP
      - "443:8443"     # HTTPS
      - "9090:9090"    # Admin/Metrics

    # Configuration
    volumes:
      - ./config.toml:/etc/highper-gateway/config.toml:ro
      - ./certs:/etc/highper-gateway/certs:ro
      - proxy-logs:/var/log/highper-gateway
      - proxy-data:/var/lib/highper-gateway

    # Environment variables
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    # Health check
    healthcheck:
      test: ["CMD", "/usr/local/bin/highper-gateway", "health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    # Network
    networks:
      - proxy-network

    # Security
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (uncomment if config supports it)
    # read_only: true

    # Temporary filesystem for /tmp
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Prometheus (optional - for monitoring)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9091:9090"

    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/highper_gateway_alerts.yml:/etc/prometheus/highper_gateway_alerts.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

    networks:
      - proxy-network

    depends_on:
      - highper-gateway

  # Grafana (optional - for visualization)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/highper-gateway.json:ro

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false

    networks:
      - proxy-network

    depends_on:
      - prometheus

volumes:
  proxy-logs:
    driver: local
  proxy-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  proxy-network:
    driver: bridge

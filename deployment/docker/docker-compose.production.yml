version: '3.8'

# Production Docker Compose with full monitoring stack
services:
  # Rust Reverse Proxy
  highper-gateway:
    image: highper-gateway:latest
    container_name: highper-gateway-prod
    restart: always

    # Ports
    ports:
      - "80:8080"
      - "443:8443"
      - "127.0.0.1:9090:9090"  # Admin API only on localhost

    # Configuration
    volumes:
      - /opt/highper-gateway/config.toml:/etc/highper-gateway/config.toml:ro
      - /opt/highper-gateway/certs:/etc/highper-gateway/certs:ro
      - /var/log/highper-gateway:/var/log/highper-gateway
      - /var/lib/highper-gateway:/var/lib/highper-gateway

    # Environment
    environment:
      - RUST_LOG=warn
      - RUST_BACKTRACE=0

    # Resource limits (production)
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 4G

    # Health check
    healthcheck:
      test: ["CMD", "/usr/local/bin/highper-gateway", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Logging (structured logging for production)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service,environment"
    labels:
      - "service=highper-gateway"
      - "environment=production"

    # Network
    networks:
      - proxy-network

    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Ulimits
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus-prod
    restart: always

    ports:
      - "127.0.0.1:9091:9090"

    volumes:
      - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/highper_gateway_alerts.yml:/etc/prometheus/highper_gateway_alerts.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

    networks:
      - proxy-network

    depends_on:
      - highper-gateway

  # Grafana
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana-prod
    restart: always

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - /opt/monitoring/grafana:/etc/grafana/provisioning:ro

    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.example.com
      - GF_INSTALL_PLUGINS=

    networks:
      - proxy-network

    depends_on:
      - prometheus

  # Alertmanager (optional)
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager-prod
    restart: always

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - /opt/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

    networks:
      - proxy-network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

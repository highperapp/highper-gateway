---
# Service for external traffic
apiVersion: v1
kind: Service
metadata:
  name: highper-gateway
  namespace: default
  labels:
    app: highper-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: highper-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless service for direct pod access
apiVersion: v1
kind: Service
metadata:
  name: highper-gateway-headless
  namespace: default
  labels:
    app: highper-gateway
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: highper-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
# Service for metrics (internal only)
apiVersion: v1
kind: Service
metadata:
  name: highper-gateway-metrics
  namespace: default
  labels:
    app: highper-gateway
spec:
  type: ClusterIP
  selector:
    app: highper-gateway
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

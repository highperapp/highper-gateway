apiVersion: v1
kind: ConfigMap
metadata:
  name: highper-gateway-config
  namespace: default
  labels:
    app: highper-gateway
data:
  config.toml: |
    # Rust Reverse Proxy Configuration for Kubernetes

    [server]
    bind = "0.0.0.0:8080"
    workers = 0  # Auto-detect based on CPU cores

    [server.tls]
    enabled = true
    bind = "0.0.0.0:8443"
    cert_path = "/etc/highper-gateway/certs/tls.crt"
    key_path = "/etc/highper-gateway/certs/tls.key"
    min_version = "1.2"
    cipher_suites = [
        "TLS_AES_256_GCM_SHA384",
        "TLS_AES_128_GCM_SHA256",
        "TLS_CHACHA20_POLY1305_SHA256",
    ]

    [admin]
    enabled = true
    bind = "0.0.0.0:9090"

    [admin.endpoints]
    health = true
    metrics = true
    ready = true
    config = false  # Disable in production

    [logging]
    level = "info"
    format = "json"

    [middleware.security_headers]
    enabled = true
    preset = "strict"

    [middleware.request_size_limit]
    enabled = true
    max_body_size = 10485760  # 10 MB

    [middleware.rate_limiting]
    enabled = true
    requests_per_second = 1000
    burst_size = 2000

    [upstreams.connection]
    max_connections_per_upstream = 500
    min_idle_connections = 50
    connection_timeout = "5s"
    idle_timeout = "90s"

    [upstreams.connection.connection_pool]
    max_idle_per_host = 200
    min_idle_per_host = 50
    prewarm = true
    metrics_enabled = true

    [upstreams.timeouts]
    connect = "5s"
    request = "30s"
    idle = "90s"

    [upstreams.retry]
    max_attempts = 3
    backoff_base = "100ms"
    backoff_max = "10s"

    [upstreams.circuit_breaker]
    enabled = true
    failure_threshold = 5
    success_threshold = 2
    timeout = "60s"
    half_open_max_requests = 3

    [observability.metrics]
    enabled = true

    [observability.tracing]
    enabled = false

    # Example upstream
    [[routes]]
    path = "/api"
    upstream = "http://backend-service:8080"
    methods = ["GET", "POST", "PUT", "DELETE"]

[package]
name = "fast-backend"
version = "1.0.0"
edition = "2021"

[workspace]

[[bin]]
name = "fast-backend"
path = "fast-backend-prometheus.rs"

[dependencies]
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    app: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
      - name: highper-gateway
        image: rust:latest
        command: ["/usr/local/bin/highper-gateway", "start", "--config", "/etc/highper-gateway/config.toml"]
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "8"
            memory: 8Gi
          requests:
            cpu: "4"
            memory: 4Gi
        volumeMounts:
        - name: proxy-binary
          mountPath: /usr/local/bin/highper-gateway
          subPath: highper-gateway
        - name: proxy-config
          mountPath: /etc/highper-gateway/config.toml
          subPath: config.toml
      volumes:
      - name: proxy-binary
        emptyDir: {}
      - name: proxy-config
        configMap:
          name: proxy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
data:
  config.toml: |
    [server]
    bind = ["0.0.0.0:8080"]
    workers = "auto"

    [server.performance]
    max_connections = 100000
    backlog = 65535
    tcp_nodelay = true
    tcp_keepalive = true

    [[upstreams]]
    name = "backend"
    servers = [
        { url = "http://backend:80", weight = 1, max_conns = 50000 }
    ]

    [upstreams.health_check]
    enabled = false

    [upstreams.load_balancing]
    algorithm = "round_robin"

    [upstreams.connection]
    max_connections_per_upstream = 50000
    min_idle_connections = 1000
    connection_timeout = "10s"
    tcp_nodelay = true
    tcp_keepalive = true
    circuit_breaker_enabled = false
    retry_max_attempts = 0

    [[routes]]
    name = "default"
    upstream = "backend"

    [routes.match]
    paths = ["/"]

    [observability]
    log_level = "warn"
    access_log = false
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  selector:
    app: proxy
  ports:
  - port: 8080
    targetPort: 8080

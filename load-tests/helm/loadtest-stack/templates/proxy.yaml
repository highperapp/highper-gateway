apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
data:
  config.toml: |
    [server]
    bind = ["0.0.0.0:8080"]
    workers = "auto"

    [server.performance]
    max_connections = 20000
    backlog = 2048
    tcp_nodelay = true
    tcp_keepalive = true

    [[upstreams]]
    name = "backend"
    servers = [
        { url = "http://backend:80", weight = 1, max_conns = 1000 }
    ]

    [upstreams.health_check]
    enabled = false

    [upstreams.load_balancing]
    algorithm = "round_robin"

    [upstreams.connection]
    max_connections_per_upstream = 500
    min_idle_connections = 50
    connection_timeout = "5s"
    tcp_nodelay = true
    tcp_keepalive = true
    circuit_breaker_enabled = false
    retry_max_attempts = 0

    [[routes]]
    name = "default"
    upstream = "backend"

    [routes.match]
    paths = ["/"]

    [observability]
    log_level = "warn"
    access_log = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    app: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
      - name: highper-gateway
        image: {{ .Values.proxy.image }}:{{ .Values.proxy.tag }}
        imagePullPolicy: Never
        ports:
        - containerPort: {{ .Values.proxy.port }}
          name: http
        - containerPort: {{ .Values.proxy.metricsPort }}
          name: metrics
        env:
        - name: RUST_LOG
          value: "warn"
        resources:
          limits:
            cpu: {{ .Values.proxy.resources.limits.cpu }}
            memory: {{ .Values.proxy.resources.limits.memory }}
          requests:
            cpu: {{ .Values.proxy.resources.requests.cpu }}
            memory: {{ .Values.proxy.resources.requests.memory }}
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/highper-gateway/config.toml
          subPath: config.toml
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.proxy.metricsPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: proxy-config
        configMap:
          name: proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  type: NodePort
  selector:
    app: proxy
  ports:
  - port: {{ .Values.proxy.port }}
    targetPort: {{ .Values.proxy.port }}
    nodePort: 30080
    name: http
  - port: {{ .Values.proxy.metricsPort }}
    targetPort: {{ .Values.proxy.metricsPort }}
    nodePort: 30090
    name: metrics

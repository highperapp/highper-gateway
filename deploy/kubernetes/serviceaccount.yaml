---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: highper-gateway
  namespace: default
  labels:
    app: highper-gateway
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: highper-gateway
  namespace: default
  labels:
    app: highper-gateway
rules:
  # Allow reading ConfigMaps (for dynamic config reload if implemented)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]

  # Allow reading Secrets (for TLS certificates)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: highper-gateway
  namespace: default
  labels:
    app: highper-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: highper-gateway
subjects:
  - kind: ServiceAccount
    name: highper-gateway
    namespace: default

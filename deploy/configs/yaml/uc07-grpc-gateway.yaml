# Highper Gateway Configuration
# Use Case 07: gRPC Gateway
# Ports: 9090, 443

server:
  name: "highper-gateway-grpc"

# io_uring configuration
io_uring:
  entries: 4096
  sq_poll: true
  sq_poll_cpu: 0

# TLS for gRPC
tls:
  enabled: true
  cert: /etc/highper-gateway/certs/server.crt
  key: /etc/highper-gateway/certs/server.key

# gRPC listeners
listeners:
  - name: grpc-main
    protocol: grpc
    bind: "0.0.0.0:9090"
    routes:
      - match:
          service: "user.UserService"
        backend: user-grpc
      - match:
          service: "product.ProductService"
        backend: product-grpc
      - match:
          service: "order.OrderService"
        backend: order-grpc
      - match:
          service: "*"  # Catch-all
        backend: default-grpc

  - name: grpc-tls
    protocol: grpc
    bind: "0.0.0.0:443"
    tls: default
    routes:
      - match:
          service: "*"
        backend: default-grpc

# gRPC backends
backends:
  - name: user-grpc
    strategy: round_robin
    protocol: grpc
    servers:
      - address: "user-service:9090"
      - address: "user-service-2:9090"
    health_check:
      enabled: true
      protocol: grpc
      service: "grpc.health.v1.Health"
      interval: 10
      timeout: 5

  - name: product-grpc
    strategy: least_conn
    protocol: grpc
    servers:
      - address: "product-service:9090"
    health_check:
      enabled: true
      protocol: grpc
      service: "grpc.health.v1.Health"
      interval: 10

  - name: order-grpc
    strategy: round_robin
    protocol: grpc
    servers:
      - address: "order-service:9090"
    health_check:
      enabled: true
      protocol: grpc
      service: "grpc.health.v1.Health"
      interval: 5

  - name: default-grpc
    strategy: round_robin
    protocol: grpc
    servers:
      - address: "default-service:9090"

# gRPC settings
grpc:
  max_message_size: 16777216  # 16MB
  keepalive:
    time: 30000
    timeout: 5000
    permit_without_stream: true
  compression:
    enabled: true
    algorithms:
      - gzip
      - snappy

# Logging
logging:
  level: info
  format: json
  output: /var/log/highper-gateway/gateway.log

# Metrics
metrics:
  enabled: true
  endpoint: /metrics
  port: 9091  # Different port for metrics

# Health check (HTTP)
health:
  enabled: true
  endpoint: /health
  port: 8081

# Highper Gateway - Docker Compose Configuration
# Use case: HTTP Load Balancer (02) - Default

version: "3.8"

services:
  highper-gateway:
    image: highpergateway/highper-gateway:latest
    container_name: highper-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"   # Health check
      - "9090:9090"   # Metrics
    volumes:
      - ./config:/etc/highper-gateway:ro
      - gateway-logs:/var/log/highper-gateway
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    # Required for io_uring
    cap_add:
      - IPC_LOCK
      - NET_BIND_SERVICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - gateway-network

  # Optional: Example backend services
  backend-1:
    image: nginx:alpine
    container_name: backend-1
    networks:
      - gateway-network
    profiles:
      - with-backends

  backend-2:
    image: nginx:alpine
    container_name: backend-2
    networks:
      - gateway-network
    profiles:
      - with-backends

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gateway-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - gateway-network
    profiles:
      - monitoring

volumes:
  gateway-logs:
  prometheus-data:
  grafana-data:

networks:
  gateway-network:
    driver: bridge

{{- if and .Values.tls.enabled (or .Values.tls.cert .Values.tls.key) (not .Values.tls.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "highper-gateway.fullname" . }}-tls
  labels:
    {{- include "highper-gateway.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if .Values.tls.cert }}
  tls.crt: {{ .Values.tls.cert | b64enc | quote }}
  {{- end }}
  {{- if .Values.tls.key }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
  {{- end }}
  {{- if .Values.tls.ca }}
  ca.crt: {{ .Values.tls.ca | b64enc | quote }}
  {{- end }}
{{- end }}

---
# Highper Gateway - Ansible Role Tasks

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - "default.yml"
  tags: [highper-gateway, always]

- name: Check kernel version for io_uring support
  ansible.builtin.shell: uname -r | cut -d. -f1,2
  register: kernel_version
  changed_when: false
  tags: [highper-gateway, checks]

- name: Warn if kernel version is below 5.11
  ansible.builtin.debug:
    msg: "WARNING: Kernel {{ kernel_version.stdout }} may have limited io_uring support. Recommended: 5.11+"
  when: kernel_version.stdout is version('5.11', '<')
  tags: [highper-gateway, checks]

- name: Install required packages
  ansible.builtin.package:
    name: "{{ highper_gateway_packages }}"
    state: present
  tags: [highper-gateway, packages]

- name: Create service user
  ansible.builtin.user:
    name: "{{ highper_gateway_user }}"
    group: "{{ highper_gateway_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ highper_gateway_data_dir }}"
    create_home: false
  tags: [highper-gateway, user]

- name: Create service group
  ansible.builtin.group:
    name: "{{ highper_gateway_group }}"
    system: true
    state: present
  tags: [highper-gateway, user]

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(highper_gateway_user) }}"
    group: "{{ item.group | default(highper_gateway_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ highper_gateway_config_dir }}", mode: "0750" }
    - { path: "{{ highper_gateway_config_dir }}/certs", mode: "0700" }
    - { path: "{{ highper_gateway_config_dir }}/rules", mode: "0750" }
    - { path: "{{ highper_gateway_config_dir }}/backends", mode: "0750" }
    - { path: "{{ highper_gateway_log_dir }}", mode: "0755" }
    - { path: "{{ highper_gateway_data_dir }}", mode: "0755" }
  tags: [highper-gateway, directories]

- name: Configure system limits
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/highper-gateway.conf
    owner: root
    group: root
    mode: "0644"
  tags: [highper-gateway, limits]

- name: Configure sysctl parameters
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-highper-gateway.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings
  when: highper_gateway_sysctl_tuning
  tags: [highper-gateway, sysctl]

- name: Deploy main configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ highper_gateway_config_dir }}/config.yaml"
    owner: "{{ highper_gateway_user }}"
    group: "{{ highper_gateway_group }}"
    mode: "0640"
  notify: Reload highper-gateway
  tags: [highper-gateway, config]

- name: Deploy systemd service
  ansible.builtin.template:
    src: highper-gateway.service.j2
    dest: /etc/systemd/system/highper-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart highper-gateway
  tags: [highper-gateway, service]

- name: Configure log rotation
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/highper-gateway
    owner: root
    group: root
    mode: "0644"
  tags: [highper-gateway, logrotate]

- name: Deploy TLS certificates
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ highper_gateway_config_dir }}/certs/{{ item.dest }}"
    owner: "{{ highper_gateway_user }}"
    group: "{{ highper_gateway_group }}"
    mode: "0600"
  loop:
    - { src: "{{ highper_gateway_tls_cert_path }}", dest: "server.crt" }
    - { src: "{{ highper_gateway_tls_key_path }}", dest: "server.key" }
  when:
    - highper_gateway_tls_enabled
    - highper_gateway_tls_cert_path | length > 0
    - highper_gateway_tls_key_path | length > 0
  notify: Reload highper-gateway
  tags: [highper-gateway, tls]

- name: Deploy CA certificate
  ansible.builtin.copy:
    src: "{{ highper_gateway_tls_ca_path }}"
    dest: "{{ highper_gateway_config_dir }}/certs/ca.crt"
    owner: "{{ highper_gateway_user }}"
    group: "{{ highper_gateway_group }}"
    mode: "0644"
  when:
    - highper_gateway_tls_enabled
    - highper_gateway_tls_ca_path | length > 0
  notify: Reload highper-gateway
  tags: [highper-gateway, tls]

- name: Enable highper-gateway service
  ansible.builtin.systemd:
    name: highper-gateway
    enabled: "{{ highper_gateway_service_enabled }}"
    daemon_reload: true
  tags: [highper-gateway, service]

- name: Start highper-gateway service
  ansible.builtin.systemd:
    name: highper-gateway
    state: started
  when: highper_gateway_service_started
  tags: [highper-gateway, service]

- name: Display deployment summary
  ansible.builtin.debug:
    msg: |
      Highper Gateway deployment complete:
        - Environment: {{ highper_gateway_environment }}
        - Use case: {{ highper_gateway_use_case }}
        - Config: {{ highper_gateway_config_dir }}/config.yaml
        - Logs: {{ highper_gateway_log_dir }}
        - Service enabled: {{ highper_gateway_service_enabled }}
        - Service started: {{ highper_gateway_service_started }}
  tags: [highper-gateway, summary]

---
# Highper Gateway - Ansible Role Defaults

# Gateway version
highper_gateway_version: "latest"

# Environment
highper_gateway_environment: "prod"

# Use case (01-15)
highper_gateway_use_case: "02"

# User and group
highper_gateway_user: "highper-gateway"
highper_gateway_group: "highper-gateway"

# Directories
highper_gateway_config_dir: "/etc/highper-gateway"
highper_gateway_log_dir: "/var/log/highper-gateway"
highper_gateway_data_dir: "/var/lib/highper-gateway"
highper_gateway_bin_path: "/usr/bin/highper-gateway"

# io_uring configuration
highper_gateway_iouring_entries: 4096
highper_gateway_iouring_sq_poll: true
highper_gateway_iouring_sq_poll_cpu: 0

# Logging
highper_gateway_log_level: "info"
highper_gateway_log_format: "json"

# Metrics
highper_gateway_metrics_enabled: true
highper_gateway_metrics_port: 9090
highper_gateway_metrics_endpoint: "/metrics"

# Health check
highper_gateway_health_enabled: true
highper_gateway_health_port: 8081
highper_gateway_health_endpoint: "/health"

# System limits
highper_gateway_limit_memlock: "infinity"
highper_gateway_limit_nofile: 1048576
highper_gateway_limit_nproc: "infinity"

# Sysctl tuning
highper_gateway_sysctl_tuning: true

# TLS configuration (optional)
highper_gateway_tls_enabled: false
highper_gateway_tls_cert_path: ""
highper_gateway_tls_key_path: ""
highper_gateway_tls_ca_path: ""

# Backend configuration (optional)
highper_gateway_backends: []
# Example:
# highper_gateway_backends:
#   - name: "web-backend"
#     servers:
#       - "10.0.0.1:8080"
#       - "10.0.0.2:8080"
#     health_check:
#       enabled: true
#       path: "/health"

# Use case port mappings
highper_gateway_use_case_ports:
  "01": [80, 443, 3306, 5432]
  "02": [80, 8080]
  "03": [443, 8443]
  "04": [8080, 443]
  "05": [443]
  "06": [80, 443, 8080]
  "07": [9090, 443]
  "08": [3306, 5432, 6379]
  "09": [443]
  "10": [80, 443, 8080, 9090]
  "11": [80, 443]
  "12": [8080, 8500]
  "13": [4000, 443]
  "14": [80, 443]
  "15": [80, 443]

# Service management
highper_gateway_service_enabled: true
highper_gateway_service_started: false  # Don't start until binary is installed

server:
  bind:
    - "0.0.0.0:8080"
  tls_bind: []
  workers: "2"
  protocols:
    - http1
    - http2

upstreams:
  - name: "backend_servers"
    servers:
      - url: "http://127.0.0.1:8081"
        weight: 1
      - url: "http://127.0.0.1:8082"
        weight: 1
      - url: "http://127.0.0.1:8083"
        weight: 1
    load_balancing:
      algorithm: round_robin
    health_check:
      active:
        enabled: true
        path: "/"
        interval: 10s
        timeout: 5s
        healthy_threshold: 2
        unhealthy_threshold: 3

routes:
  - name: "main_route"
    match:
      paths:
        - "/*"
    upstream: "backend_servers"

observability:
  logging:
    level: "info"
    format: "pretty"
  metrics:
    enabled: true
    prometheus:
      enabled: true
      port: 9090
